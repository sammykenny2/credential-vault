# Security headers for every response served by nginx.
#
# nginx does not inherit add_header from the server block into a location that
# declares its own add_header, so this file is included in the server block AND
# in every location that adds headers of its own.
#
# connect-src allows the Have I Been Pwned range API, which the browser calls
# directly (k-anonymity: only 5 hex chars of the SHA-1 leave the device).
#
# script-src needs 'wasm-unsafe-eval': the vault key is derived with Argon2id
# from hash-wasm, which compiles WebAssembly. It permits WebAssembly
# compilation only; JavaScript eval stays blocked ('unsafe-eval' is not set).
# Without it, vault setup and unlock fail with "WebAssembly.compile() blocked
# by CSP" (the Vite dev server sends no CSP, so only the nginx build shows it).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.pwnedpasswords.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
