# Credential Vault - Docker Compose Configuration
# Self-hosted behind Tailscale (no exposed ports to LAN). Runs the same way on
# Docker Desktop for Windows and on a NAS container host.
#
# Deploy with:  .\scripts\windows\Deploy-CredentialVault.ps1
# or by hand:   docker compose --env-file .env.production up -d --build
# `--env-file` supplies the ${...} values below AND is passed to the backend
# through env_file. Keep .env for local development only.

# Fixed project name: volumes are credential-vault_vault_data and
# credential-vault_tailscale_state whatever the checkout folder is called.
name: credential-vault

services:
  # ============================================
  # Tailscale Sidecar (VPN Access Point)
  # ============================================
  tailscale:
    image: tailscale/tailscale:latest
    # Tailnet machine name; the HTTPS address becomes <TS_HOSTNAME>.<tailnet>.ts.net
    hostname: ${TS_HOSTNAME:-credential-vault}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-credential-vault}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./config/tailscale:/config:ro
    # Userspace networking needs no NET_ADMIN/SYS_MODULE capabilities.
    restart: unless-stopped
    networks:
      - vault-internal
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ============================================
  # Backend API (FastAPI)
  # ============================================
  backend:
    # Fixed image name so a build can be moved to another host with
    # `docker save` / `docker load` and started there without rebuilding.
    image: credential-vault-backend:${VAULT_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      # Pinned here so a stray APP_ENV in the env file cannot downgrade a
      # deployment to development mode (open CORS, public /docs, SQL echo).
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///data/credential_vault.db
      - REQUIRE_TAILSCALE=${REQUIRE_TAILSCALE:-true}
    volumes:
      # Named volume, not ./data: ./data is the development database, a bind
      # mount from NTFS is unreliable for SQLite locking on Docker Desktop, and
      # on a NAS the host folder would not be writable by appuser (uid 1000).
      - vault_data:/app/data
    restart: unless-stopped
    networks:
      - vault-internal
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    # No ports exposed - access only via Tailscale

  # ============================================
  # Frontend (React + Nginx)
  # ============================================
  frontend:
    image: credential-vault-frontend:${VAULT_IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vault-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    # No ports exposed - access only via Tailscale


# ============================================
# Volumes
# ============================================
volumes:
  tailscale_state:
    driver: local
  # The vault database. Back up / restore / move it with
  # scripts/windows/Deploy-CredentialVault.ps1 -Backup / -Restore.
  vault_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  vault-internal:
    driver: bridge
