# Credential Vault - Docker Compose Configuration
# Deploy to NAS via Tailscale (no exposed ports to LAN)

version: '3.8'

services:
  # ============================================
  # Tailscale Sidecar (VPN Access Point)
  # ============================================
  tailscale:
    image: tailscale/tailscale:latest
    hostname: credential-vault
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./config/tailscale:/config:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    networks:
      - vault-internal
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ============================================
  # Backend API (FastAPI)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-vault}:${DB_PASSWORD}@db:5432/${DB_NAME:-credential_vault}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-credential-vault}
      - REQUIRE_TAILSCALE=${REQUIRE_TAILSCALE:-true}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vault-internal
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    # No ports exposed - access only via Tailscale

  # ============================================
  # Frontend (React + Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vault-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    # No ports exposed - access only via Tailscale

  # ============================================
  # Database (PostgreSQL)
  # ============================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-vault}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-credential_vault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - vault-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vault} -d ${DB_NAME:-credential_vault}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    shm_size: '128mb'
    ports:
      - "5432:5432"
    # No ports exposed - internal only

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  tailscale_state:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  vault-internal:
    driver: bridge
