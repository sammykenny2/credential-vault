# Credential Vault - Docker Compose Configuration
# Deploy to NAS via Tailscale (no exposed ports to LAN)

version: '3.8'

services:
  # ============================================
  # Tailscale Sidecar (VPN Access Point)
  # ============================================
  tailscale:
    image: tailscale/tailscale:latest
    hostname: credential-vault
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./config/tailscale:/config:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    networks:
      - vault-internal
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ============================================
  # Backend API (FastAPI)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=sqlite+aiosqlite:///data/credential_vault.db
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-credential-vault}
      - REQUIRE_TAILSCALE=${REQUIRE_TAILSCALE:-true}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - vault-internal
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    # No ports exposed - access only via Tailscale

  # ============================================
  # Frontend (React + Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vault-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    # No ports exposed - access only via Tailscale


# ============================================
# Volumes
# ============================================
volumes:
  tailscale_state:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  vault-internal:
    driver: bridge
