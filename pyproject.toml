[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credential-vault"
dynamic = ["version"]
description = "Self-hosted credential management system with E2EE and Google OAuth"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Kenny Chou", email = "sammykenny2@gmail.com"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Web Framework
    "fastapi>=0.161.1",
    "starlette>=1.9.0",
    "uvicorn[standard]>=0.54.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    # Security
    "PyJWT>=2.10.1",
    "cryptography>=50.0.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",
    # Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.14.2",
    "email-validator>=2.1.0",
    # Rate Limiting
    "slowapi>=0.1.9",
    # Utilities
    "python-multipart>=0.0.32",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/username/credential-vault"
Repository = "https://github.com/username/credential-vault"

[project.scripts]
credential-vault = "app.main:main"
vault-cli = "app.cli:main"

# The release version lives in VERSION (also read by the app, CI and the
# frontend build); bumping it is what publishes a release.
[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff 0.17+ also formats Python blocks inside Markdown; the snippets in docs/
# are illustrations, not code to keep formatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]
"app/schemas/*.py" = ["N815"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=app --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
