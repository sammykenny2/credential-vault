# Dependabot version updates: one PR per ecosystem per week for minor and
# patch updates (grouped), separate PRs for majors so each can be judged on
# its own. cooldown waits until a release is two weeks old, so a compromised
# or broken release has time to be pulled before it is proposed here.
version: 2
updates:
  # Workflow actions are pinned by commit SHA; Dependabot moves the SHA and
  # the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types: [minor, patch]

  # Python dependencies are locked in uv.lock
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python:
        update-types: [minor, patch]

  # Base images in both Dockerfiles. Python and Node stay on their current
  # minor/major line (Python 3.14, Node 24) until that move is made on purpose.
  - package-ecosystem: docker
    directories: [/, /frontend]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      images:
        update-types: [minor, patch]

  # The Tailscale sidecar in docker-compose.yaml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      frontend:
        update-types: [minor, patch]
