# Builds both images (nothing is pushed) when a change could break them, so
# a broken Dockerfile or dependency set shows up before a release does.
# Release images themselves are built by ci.yaml.

name: Docker build check

on:
  push:
    branches: [main, master]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - docker-compose.yaml
      - frontend/Dockerfile
      - frontend/.dockerignore
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/nginx.conf
      - frontend/security-headers.conf
      - .github/workflows/docker-check.yaml
  pull_request:
    branches: [main, master]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - docker-compose.yaml
      - frontend/Dockerfile
      - frontend/.dockerignore
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/nginx.conf
      - frontend/security-headers.conf
      - .github/workflows/docker-check.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          provenance: false
          sbom: false
          build-args: |
            APP_REVISION=${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: false
          provenance: false
          sbom: false
          build-args: |
            APP_REVISION=${{ github.sha }}
