# CI/CD Pipeline for Credential Vault

name: CI

# CI paused: the account's Actions quota for this month is exhausted, so
# pushes and pull requests do not trigger runs. Run manually from the Actions
# tab (workflow_dispatch) when needed. To re-enable automatic runs, restore:
#   push:
#     branches: [main, master]
#   pull_request:
#     branches: [main, master]
on:
  workflow_dispatch:

jobs:
  # ============================================
  # Python Backend
  # ============================================
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: |
          mypy app/ --ignore-missing-imports

      - name: Test with pytest
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        continue-on-error: true

  # ============================================
  # Security Scanning
  # ============================================
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Audit Python dependencies
        run: |
          pip-audit --strict

  # ============================================
  # Frontend
  # ============================================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  # ============================================
  # Docker Build Validation
  # ============================================
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t credential-vault:test .

  # ============================================
  # Basic validation (always runs)
  # ============================================
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f AGENTS.md || (echo "Missing AGENTS.md" && exit 1)
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          echo "All required files present."

      - name: Validate YAML files
        run: |
          echo "Validating YAML files..."
          python -c "
          import yaml, glob, sys
          errors = 0
          for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f'Valid: {f}')
              except Exception as e:
                  print(f'Invalid: {f} - {e}')
                  errors += 1
          sys.exit(1 if errors else 0)
          "
