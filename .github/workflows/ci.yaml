# CI/CD Pipeline for Credential Vault

name: CI

# Documentation-only changes skip CI: a run starts only if some changed file
# is outside docs/ and is not Markdown. VERSION is not ignored, so a release
# is never skipped.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to a full commit SHA (the tag is in the comment), so
# a moved or force-pushed tag cannot change what runs here. Dependabot
# (.github/dependabot.yml) proposes updates.

jobs:
  # ============================================
  # Python Backend
  # ============================================
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: uv.lock

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"   # same uv as the Dockerfile and the one that wrote uv.lock

      # Fails when pyproject.toml changed without `uv lock`
      - name: Check that uv.lock is current
        run: uv lock --check

      # The locked, hashed set, the same one the backend image installs
      - name: Install dependencies
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements-txt -o "${RUNNER_TEMP}/requirements.txt"
          pip install --require-hashes -r "${RUNNER_TEMP}/requirements.txt"
          pip install --no-deps -e .

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: |
          mypy app/ --ignore-missing-imports

      - name: Test with pytest
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
        continue-on-error: true

  # ============================================
  # Security Scanning
  # ============================================
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"   # same uv as the Dockerfile and the one that wrote uv.lock

      # Audit every locked package (runtime and dev, all platforms) from
      # uv.lock itself; the project is left out since it is not on PyPI.
      - name: Audit Python dependencies
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements-txt -o "${RUNNER_TEMP}/requirements.txt"
          pip install --require-hashes -r "${RUNNER_TEMP}/requirements.txt"
          pip-audit --strict --disable-pip --require-hashes -r "${RUNNER_TEMP}/requirements.txt"

  # ============================================
  # Frontend
  # ============================================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  # ============================================
  # Release: build, scan, publish (only when VERSION is new)
  # ============================================
  # Runs only for a release: a push to main whose VERSION has no v<VERSION>
  # tag yet (decided in `validate`). Three jobs, each with only the
  # permissions it needs:
  #   publish  builds both images, pushes them tagged with the commit SHA and
  #            attests their build provenance
  #   scan     scans the pushed images with grype and has no write access, so
  #            a compromised scanner has no token worth stealing
  #   release  after a clean scan only: tags the images with the version and
  #            `latest`, records each digest as a commit status
  #            (release/backend, release/frontend), creates the GitHub
  #            release v<VERSION> and keeps the newest 5 image versions
  # The release tag is created last, so a failed release is retried by the
  # next push with the same VERSION. Other runs skip all three.
  # scripts/windows/Deploy-CredentialVault.ps1 resolves releases through the
  # GitHub API and pulls by digest, so a registry credential alone cannot
  # change what gets deployed. Nothing here deploys.
  publish:
    needs: [python, security, frontend, validate]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push the images to GHCR
      id-token: write       # sign the build provenance (Sigstore, keyless)
      attestations: write   # store the provenance with GitHub
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    outputs:
      backend: ${{ steps.names.outputs.backend }}
      frontend: ${{ steps.names.outputs.frontend }}
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/credential-vault-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/credential-vault-frontend" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom are off so each push is a single manifest. With them
      # on, buildx wraps the image in an index with untagged child manifests,
      # and the retention step would count and delete those children, breaking
      # the tagged images. A future multi-arch (linux/arm64) build is also an
      # index and needs an index-aware cleanup instead.
      - name: Build backend image
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_REVISION=${{ github.sha }}
          tags: ${{ steps.names.outputs.backend }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.names.outputs.created }}

      - name: Build frontend image
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            APP_REVISION=${{ github.sha }}
          tags: ${{ steps.names.outputs.frontend }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.names.outputs.created }}

      # Signed SLSA provenance tying each digest to this repository, this
      # workflow and this commit; the deploy script checks it with
      # `gh attestation verify`. Stored with GitHub, not pushed to GHCR, where
      # the retention step would count it as an image version.
      - name: Attest the backend image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.backend }}
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: false

      - name: Attest the frontend image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.frontend }}
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: false

  # Fails on any High or Critical vulnerability that has a fixed version
  # (unfixed ones cannot be acted on and would block every release).
  scan:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Scan the backend image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ needs.publish.outputs.backend }}@${{ needs.publish.outputs.backend_digest }}
          grype-version: v0.120.1
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table

      - name: Scan the frontend image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ needs.publish.outputs.frontend }}@${{ needs.publish.outputs.frontend_digest }}
          grype-version: v0.120.1
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table

  release:
    needs: [validate, publish, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the v<VERSION> release and tag
      packages: write   # tag and prune images in GHCR
      statuses: write   # record the image digests on the commit
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PREVIOUS: ${{ needs.validate.outputs.previous }}
      BACKEND: ${{ needs.publish.outputs.backend }}
      FRONTEND: ${{ needs.publish.outputs.frontend }}
      BACKEND_DIGEST: ${{ needs.publish.outputs.backend_digest }}
      FRONTEND_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
      BACKEND_REF: ${{ needs.publish.outputs.backend }}@${{ needs.publish.outputs.backend_digest }}
      FRONTEND_REF: ${{ needs.publish.outputs.frontend }}@${{ needs.publish.outputs.frontend_digest }}
    steps:
      # Re-put each scanned manifest under the new tags through the registry
      # API, so the tags name exactly the scanned digest. (`docker buildx
      # imagetools create` would wrap it in a new index with another digest.)
      - name: Tag the scanned images with the version and latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          media="application/vnd.oci.image.manifest.v1+json"
          for pair in "${BACKEND}|${BACKEND_DIGEST}" "${FRONTEND}|${FRONTEND_DIGEST}"; do
            image="${pair%%|*}"
            digest="${pair#*|}"
            repo="${image#ghcr.io/}"
            token="$(curl -fsS -u "${GITHUB_ACTOR}:${GH_TOKEN}" \
              "https://ghcr.io/token?scope=repository:${repo}:pull,push" | jq -r .token)"
            manifest="${RUNNER_TEMP}/manifest.json"
            curl -fsS -H "Authorization: Bearer ${token}" -H "Accept: ${media}" \
              -o "${manifest}" "https://ghcr.io/v2/${repo}/manifests/${digest}"
            if [ "sha256:$(sha256sum "${manifest}" | cut -d' ' -f1)" != "${digest}" ]; then
              echo "Fetched manifest for ${image} does not match ${digest}"; exit 1
            fi
            for tag in "${VERSION}" latest; do
              curl -fsS -X PUT -H "Authorization: Bearer ${token}" -H "Content-Type: ${media}" \
                --data-binary "@${manifest}" "https://ghcr.io/v2/${repo}/manifests/${tag}" > /dev/null
              echo "${image}:${tag} -> ${digest}"
            done
          done

      - name: Record image digests on the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pair in "backend:${BACKEND_DIGEST}" "frontend:${FRONTEND_DIGEST}"; do
            name="${pair%%:*}"
            digest="${pair#*:}"
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success \
              -f context="release/${name}" \
              -f description="${digest}" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done
          {
            echo "### Published v${VERSION}"
            echo "- backend: \`${BACKEND_REF}\`"
            echo "- frontend: \`${FRONTEND_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Notes list the commits since the previous release. --generate-notes
      # only knows merged pull requests, and changes here are pushed to main.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="${RUNNER_TEMP}/notes.md"
          {
            if [ -n "${PREVIOUS}" ]; then
              echo "## Changes since v${PREVIOUS}"
              echo
              gh api "repos/${GITHUB_REPOSITORY}/compare/v${PREVIOUS}...${GITHUB_SHA}" \
                --jq '.commits[] | select(.parents | length == 1) | "- \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"'
              echo
              echo "**Full changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/v${PREVIOUS}...v${VERSION}"
            else
              echo "First release."
            fi
            echo
            echo "## Images"
            echo
            echo "- \`${BACKEND_REF}\`"
            echo "- \`${FRONTEND_REF}\`"
          } > "${notes}"
          cat "${notes}"
          gh release create "v${VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" --title "v${VERSION}" --notes-file "${notes}"

      - name: Keep the newest 5 backend images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: credential-vault-backend
          package-type: container
          min-versions-to-keep: 5

      - name: Keep the newest 5 frontend images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: credential-vault-frontend
          package-type: container
          min-versions-to-keep: 5

  # ============================================
  # Basic validation (always runs)
  # ============================================
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f AGENTS.md || (echo "Missing AGENTS.md" && exit 1)
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          echo "All required files present."

      # Releases are cut from VERSION, so it must be x.y.z and never go below
      # the newest release (`latest` would move backwards). A push to main with
      # a VERSION that has no v<VERSION> tag yet is a release (runs `publish`).
      - name: Check VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must be x.y.z, got '${version}'"; exit 1
          fi
          newest="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | sort -V | tail -n 1)"
          if [ -n "${newest}" ] && [ "$(printf '%s\n%s\n' "${newest}" "${version}" | sort -V | tail -n 1)" != "${version}" ]; then
            echo "VERSION ${version} is lower than the newest release v${newest}"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "previous=${newest}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" = refs/heads/main ] && [ "${GITHUB_EVENT_NAME}" != pull_request ] \
            && [ "${version}" != "${newest}" ] \
            && ! git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "VERSION ${version} is new (newest release: ${newest:-none}): releasing"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "VERSION ${version} (newest release: ${newest:-none}): no release"
          fi

      - name: Validate YAML files
        run: |
          echo "Validating YAML files..."
          python -c "
          import yaml, glob, sys
          errors = 0
          for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f'Valid: {f}')
              except Exception as e:
                  print(f'Invalid: {f} - {e}')
                  errors += 1
          sys.exit(1 if errors else 0)
          "
