# CI/CD Pipeline for Credential Vault

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================
  # Python Backend
  # ============================================
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: |
          mypy app/ --ignore-missing-imports

      - name: Test with pytest
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        continue-on-error: true

  # ============================================
  # Security Scanning
  # ============================================
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      # Audit the pinned dependencies, not the project itself: the editable
      # credential-vault install is not on PyPI, and --strict fails on it.
      - name: Audit Python dependencies
        run: |
          pip freeze --exclude-editable > "${RUNNER_TEMP}/requirements-audit.txt"
          pip-audit --strict --disable-pip --no-deps -r "${RUNNER_TEMP}/requirements-audit.txt"

  # ============================================
  # Frontend
  # ============================================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  # ============================================
  # Docker images: always built, published when VERSION is new
  # ============================================
  # Every run builds both images as a Dockerfile check. A push to main whose
  # VERSION has no v<VERSION> tag yet is a release: it pushes
  # ghcr.io/<owner>/credential-vault-{backend,frontend} tagged with the
  # version, the commit SHA and `latest`, records each digest as a commit
  # status (release/backend, release/frontend), creates the GitHub release
  # v<VERSION> and keeps the newest 5 versions. The tag is created last, so a
  # failed release is retried by the next push with the same VERSION.
  # scripts/windows/Deploy-CredentialVault.ps1 resolves releases from those
  # statuses through the GitHub API and pulls by digest, so a registry
  # credential alone cannot change what gets deployed. Nothing here deploys.
  publish:
    needs: [python, security, frontend, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the v<VERSION> release and tag
      packages: write   # push and prune images in GHCR
      statuses: write   # record the image digests on the commit
    steps:
      - uses: actions/checkout@v4

      - name: Release check
        id: release
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" = refs/heads/main ] && [ "${GITHUB_EVENT_NAME}" != pull_request ] \
            && ! git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v${version}"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No release: v${version} exists or this is not main. Images are built, not pushed."
          fi

      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/credential-vault-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/credential-vault-frontend" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom are off so each push is a single manifest. With them
      # on, buildx wraps the image in an index with untagged child manifests,
      # and the retention step would count and delete those children, breaking
      # the tagged images. A future multi-arch (linux/arm64) build is also an
      # index and needs an index-aware cleanup instead.
      - name: Build backend image
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ steps.release.outputs.publish == 'true' }}
          provenance: false
          sbom: false
          build-args: |
            APP_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.names.outputs.backend }}:${{ steps.release.outputs.version }}
            ${{ steps.names.outputs.backend }}:${{ github.sha }}
            ${{ steps.names.outputs.backend }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.names.outputs.created }}

      - name: Build frontend image
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: ${{ steps.release.outputs.publish == 'true' }}
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            APP_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.names.outputs.frontend }}:${{ steps.release.outputs.version }}
            ${{ steps.names.outputs.frontend }}:${{ github.sha }}
            ${{ steps.names.outputs.frontend }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.names.outputs.created }}

      - name: Record image digests on the commit
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          for pair in "backend:${BACKEND_DIGEST}" "frontend:${FRONTEND_DIGEST}"; do
            name="${pair%%:*}"
            digest="${pair#*:}"
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success \
              -f context="release/${name}" \
              -f description="${digest}" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done
          {
            echo "### Published v${{ steps.release.outputs.version }}"
            echo "- backend: \`${{ steps.names.outputs.backend }}@${BACKEND_DIGEST}\`"
            echo "- frontend: \`${{ steps.names.outputs.frontend }}@${FRONTEND_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v${VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" --title "v${VERSION}" --generate-notes

      - name: Keep the newest 5 backend images
        if: steps.release.outputs.publish == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: credential-vault-backend
          package-type: container
          min-versions-to-keep: 5

      - name: Keep the newest 5 frontend images
        if: steps.release.outputs.publish == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: credential-vault-frontend
          package-type: container
          min-versions-to-keep: 5

  # ============================================
  # Basic validation (always runs)
  # ============================================
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f AGENTS.md || (echo "Missing AGENTS.md" && exit 1)
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          echo "All required files present."

      # Releases are cut from VERSION, so it must be x.y.z and never go below
      # the newest release (`latest` would move backwards).
      - name: Check VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must be x.y.z, got '${version}'"; exit 1
          fi
          newest="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | sort -V | tail -n 1)"
          if [ -n "${newest}" ] && [ "$(printf '%s\n%s\n' "${newest}" "${version}" | sort -V | tail -n 1)" != "${version}" ]; then
            echo "VERSION ${version} is lower than the newest release v${newest}"; exit 1
          fi
          echo "VERSION ${version} (newest release: ${newest:-none})"

      - name: Validate YAML files
        run: |
          echo "Validating YAML files..."
          python -c "
          import yaml, glob, sys
          errors = 0
          for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f'Valid: {f}')
              except Exception as e:
                  print(f'Invalid: {f} - {e}')
                  errors += 1
          sys.exit(1 if errors else 0)
          "
